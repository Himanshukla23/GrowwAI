services:
  # ---------------------------------------------------------------------------
  # 1. Backend Service (FastAPI + RAG Engine)
  # ---------------------------------------------------------------------------
  - type: web
    name: groww-assist-backend
    env: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    plan: free
    region: singapore # Closest to India for Groww data
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONPATH
        value: /app
      - key: EMBEDDING_MODEL
        value: "all-MiniLM-L6-v2"
      - key: CHROMA_COLLECTION
        value: "groww_mf_chunks_v5"
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
      - key: CHROMA_API_KEY
        sync: false # Set in Render UI
      - key: GROQ_API_KEY
        sync: false # Set in Render UI
      - key: GEMINI_API_KEY
        sync: false # Set in Render UI
      - key: CHROMA_TENANT
        sync: false
      - key: CHROMA_DATABASE
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Frontend Service (Next.js) - Optional if deployed on Vercel
  # ---------------------------------------------------------------------------
  - type: web
    name: groww-assist-frontend
    env: node
    plan: free
    region: singapore
    buildCommand: "cd frontend && npm install --prefer-offline --no-audit --no-fund && npm run build"
    startCommand: "cd frontend && npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: groww-assist-backend
          type: web
          property: url
      - key: NODE_VERSION
        value: "20"
